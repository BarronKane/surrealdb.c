language = "C"
pragma_once = true

# The status codes are written out here rather than exported from Rust.
# export.prefix would otherwise stack "sr_" onto names that already begin with
# SR_, giving sr_SR_ERROR, while every doc comment in this header refers to
# SR_ERROR. export.rename does not apply to constants, so exclusion plus an
# explicit definition is the way to keep the two in agreement.
after_includes = """
#define SR_NONE 0
#define SR_CLOSED -1
#define SR_ERROR -2
#define SR_FATAL -3
"""

[export]
prefix = "sr_"
exclude = ["SR_NONE", "SR_CLOSED", "SR_ERROR", "SR_FATAL"]


[export.rename]
"Duration" = "duration_t"
"Number" = "number_t"
"Array" = "array_t"
"Object" = "object_t"
"Value" = "value_t"
"Thing" = "thing_t"
"File" = "file_t"
"Range" = "range_t"
"Bound" = "bound_t"
"Uuid" = "uuid_t"
"Bytes" = "bytes_t"
"string_t" = "string_t"
"Id" = "id_t"
"Notification" = "notification_t"
"Action" = "action"
"BTreeMap_String__Value" = "opaque_object_internal_t"
"Stream" = "stream_t"
"Surreal" = "surreal_t"
"SurrealRpc" = "surreal_rpc_t"
"ArrayResult" = "arr_res_t"
"ArrayResultArray" = "arr_res_arr_t"
"ArrayResultArrayResult" = "arr_res_arr_res_t"
"StringResult" = "string_res_t"
"SurrealResult" = "surreal_res_t"
"Options" = "option_t"
